server.port=${PORT:8081}
kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL:localhost:9092}
kafka.topic.filing-processed=${FILING_PROCESSED_TOPIC:filing-processed}
kafka.topic.message-send=${MESSAGE_SEND_TOPIC:message-send}
kafka.topic.resource-changed=${RESOURCE_CHANGED_TOPIC:resource-changed}
kafka.topic.email-send=${EMAIL_SEND_TOPIC:email-send}
kafka.topic.strike-off-partner-objections-processed=${STRIKE_OFF_PARTNER_OBJECTIONS_PROCESSED_TOPIC:strike-off-partner-objections-processed}
management.endpoints.access.default=none
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=never
management.endpoint.health.access=read_only
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:https://otel-collector:4318}/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:https://otel-collector:4318}/v1/traces
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:https://otel-collector:4318}/v1/metrics
