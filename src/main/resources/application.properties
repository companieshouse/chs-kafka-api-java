server.port=${PORT:8081}
kafka.bootstrap-servers=${BOOTSTRAP_SERVER_URL:localhost:9092}
kafka.topic.filing-processed=${FILING_PROCESSED_TOPIC:filing-processed}
kafka.topic.message-send=${MESSAGE_SEND_TOPIC:message-send}
kafka.topic.resource-changed=${RESOURCE_CHANGED_TOPIC:resource-changed}

management.endpoints.access.default=none
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthcheck
management.endpoint.health.show-details=never
management.endpoint.health.access=read_only
